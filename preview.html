<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GitHub Banner Preview - dark.svg</title>
  <style>
    body {
      margin: 0;
      padding: 40px;
      background-color: #0d1117;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    h2 {
      color: #58a6ff;
      margin-bottom: 20px;
    }
    .banner-container {
      max-width: 1180px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      border-radius: 12px;
      overflow: hidden;
    }
    img {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <h2>Phase 1 Preview — Animated Banner (dark.svg)</h2>
  <div class="banner-container">
    <img src="dark.svg" alt="Animated Banner Dark Mode" />
  </div>
</body>
</html>
